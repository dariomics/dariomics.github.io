# ==============================================================================
# TAXONOMÍA Y PLANTILLA DE DIVULGACIÓN CIENTÍFICA (COMUNICACIÓN PÚBLICA)
# ==============================================================================
# TIPOS DISPONIBLES EN ESTA TAXONOMÍA (`type`):
#  1. article       : Artículos en revistas de divulgación, prensa y blogs
#  2. book          : Libros y monografías de comunicación pública de la ciencia
#  3. chapter       : Capítulos en obras o compilaciones de divulgación
#  4. infographic   : Infografías, esquemas ilustrados y figuras didácticas
#  5. event         : Simposios, ferias, festivales y jornadas de divulgación
#  6. presentation  : Conferencias públicas y charlas en video (YouTube, FB)
#  7. media         : Entrevistas, pódcasts, notas de prensa y radio/TV
#  8. platform      : Portales web, sitios oficiales y blogs institucionales
#  9. educational   : Guías comunitarias, cuadernos didácticos y talleres
# 10. software_tool : Herramientas interactivas, apps y software abierto (GitHub)
# 11. dataset_open  : Repositorios abiertos de imágenes y recursos gráficos
# 12. other         : Otros materiales de comunicación pública de la ciencia
# ==============================================================================

