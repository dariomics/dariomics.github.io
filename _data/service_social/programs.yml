- id: ss-music-taste
  title: "Neurociencia multisensorial: la música y el gusto"
  code: "SS-2026-19/18-1979"
  description: "Investigación de las bases neurocognitivas e integración multisensorial entre la música y el gusto mediante datos de neuroimagen (fMRI, PET y EEG)."
  areas:
    - Neurociencia multisensorial
    - Música
    - Gusto
    - Neuroimagen
  active: true
  objetivo: >-
    Apoyo en investigación, diseño de bases de datos, extracción y registro de datos, dictamen y evaluación de estudios de neuroimagen (fMRI y PET) enfocados en la actividad cerebral relacionada a la percepción musical y percepción gustativa para el desarrollo de revisiones sistemáticas y meta-análisis ALE.
  justificacion: >-
    La alimentación es una experiencia compleja de regulación nutricional constituida por factores genéticos, cognitivos, culturales y sociales que inciden en qué, cómo y cuánto se consume. Los sentidos tienen un papel fundamental en este proceso y, por ello, es necesario identificar las relaciones entre la actividad cerebral sensorial (gusto, oído, olfato, tacto y vista). Sin embargo, aunque intuitivamente los sentidos del gusto y el olfato encabezan los sentidos principales relacionados a la alimentación, los demás sentidos, incluyendo el auditivo, participan en distintos procesos que guían nuestras decisiones y conductas alimentarias antes, durante y después de la ingesta. Por ello, el estudio de las bases neuronales relacionadas con la percepción auditiva, particularmente musical, asociada a la percepción gustativa resulta imprescindible para el estudio de la alimentación como fenómeno complejo y multisensorial.
  desarrollo:
