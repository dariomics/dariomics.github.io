    - "Generación de un cronograma de actividades"
    - "Actividades interdisciplinarias basadas en investigación"
    - "Desarrollo de competencias sólidas, mediante entrenamiento, talleres y seminarios que contribuyen activamente a nuestras líneas de trabajo"
    - "La mayoría de las actividades se realiza en línea y todo se documenta en la nube"
  recursos:
