- id: ss-healthy-aging
  title: "Envejecimiento saludable y bienestar desde las ciencias sociomédicas y la salud pública"
  code: "SS-2026-19/18-2083"
  description: "Análisis de determinantes sociales, estructurales y comerciales de la salud en el envejecimiento poblacional e intervenciones sociomédicas."
  areas:
    - Envejecimiento saludable
    - Bienestar
    - Ciencias sociomédicas
    - Salud pública
  active: true
  objetivo: >-
    Apoyo en investigación, identificación, análisis de determinantes sociales de la salud y envejecimiento, del acceso y calidad de la atención médica, los programas y políticas públicas de salud, así como en el diseño de estudios e intervenciones sociales para el envejecimiento saludable y el bienestar.
  justificacion: >-
    El envejecimiento de la población es un fenómeno global que plantea desafíos para los sistemas de salud y las políticas públicas que requiere de su abordaje integral, priorizando la calidad de vida y el bienestar de las personas mayores. Por ello, es importante comprender los determinantes (sociales, económicas, comerciales, culturales, ecológicas) que influyen en la salud y bienestar de esta población. Adicionalmente, necesitamos conocer la percepción social de los usuarios (derechohabientes) respecto a la atención y servicios de salud que proporciona el IMSS, con el propósito de generar información estratégica y oportuna para la toma de decisiones, la mejora de programas, el diseño de políticas institucionales que permitan responder a las necesidades de salud y bienestar de la población.
  desarrollo:
