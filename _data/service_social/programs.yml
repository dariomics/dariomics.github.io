- id: ss-sensory-aging
  title: "Cognición sensorial, alimentación y envejecimiento"
  code: "SS-2026-19/18-1492"
  description: "Investigación y análisis de mecanismos biológicos, sociales y cognitivos sobre los sistemas sensoriales y su relación con la alimentación en el envejecimiento."
  areas:
    - Cognición sensorial
    - Alimentación
    - Envejecimiento
    - Salud Poblacional
  active: true
  sitio_web: "https://sites.google.com/view/cognicionsensorial/"
  objetivo: >-
    Apoyo para investigación y análisis de mecanismos biológicos, sociales y cognitivos sobre los sistemas sensoriales: oído (con énfasis en la música), tacto, vista, olfato y gusto, y su asociación con alimentación y envejecimiento; así como su difusión.
  justificacion: >-
    La alimentación es una experiencia compleja de regulación nutricional constituida por factores genéticos, cognitivos, culturales y sociales que inciden en qué, cómo y cuánto se consume. Los sentidos tienen un papel fundamental en este proceso y, por ello, es necesario identificar las relaciones entre la cognición sensorial (gusto, oído, olfato, tacto y vista), donde la información proveniente de todos los sentidos guía nuestras decisiones y conductas alimentarias antes, durante y después de la ingesta, particularmente en personas mayores quienes presentan una pérdida gradual de la percepción sensorial.
